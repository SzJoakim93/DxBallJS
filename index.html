<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="utf-8" />
  <title>DX Ball JS</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <section class="touch-controls touch-controls-left" aria-label="Movement controls">
    <button class="touch-button touch-button-up" data-key="38" aria-label="Move up">
      <img src="GFX/TouchInputUI/ButtonBase.png" alt="">
      <img src="GFX/TouchInputUI/ArrowUp.png" alt="">
    </button>
    <button class="touch-button touch-button-left" data-key="37" aria-label="Move left">
      <img src="GFX/TouchInputUI/ButtonBase.png" alt="">
      <img src="GFX/TouchInputUI/ArrowLeft.png" alt="">
    </button>
    <button class="touch-button touch-button-right" data-key="39" aria-label="Move right">
      <img src="GFX/TouchInputUI/ButtonBase.png" alt="">
      <img src="GFX/TouchInputUI/ArrowRight.png" alt="">
    </button>
    <button class="touch-button touch-button-down" data-key="40" aria-label="Move down">
      <img src="GFX/TouchInputUI/ButtonBase.png" alt="">
      <img src="GFX/TouchInputUI/ArrowDown.png" alt="">
    </button>
  </section>

  <canvas id="myCanvas"></canvas>
  <!--<section class="touch-controls touch-controls-system" aria-label="System controls">
    <button class="touch-button touch-button-small touch-button-pause" data-key="27" aria-label="Pause">
      <img src="GFX/TouchInputUI/ButtonBaseSmall.png" alt="">
      <img src="GFX/TouchInputUI/Pause.png" alt="Pause">
    </button>
   </section>-->
  <section class="touch-controls touch-controls-right" aria-label="Action controls">
    <button class="touch-button touch-button-a" data-key="13" aria-label="A: jump">
      <img src="GFX/TouchInputUI/ButtonBase.png" alt="">
      <img src="GFX/TouchInputUI/ButtonA.png" alt="A">
    </button>
  </section>

  <script type="text/javascript" src="Scripts/Common/keyCodes.js"></script>
  <script type="text/javascript" src="Scripts/Common/keyHandler.js"></script>
  <script type="text/javascript" src="Scripts/Common/gamepad.js"></script>
  <script type="text/javascript" src="Scripts/Common/touchControls.js"></script>
  <script type="text/javascript" src="Scripts/Common/virtaulKeyboard.js"></script>
  <script type="text/javascript" src="Scripts/Common/storage.js"></script>
  <script type="text/javascript" src="Scripts/Common/sound.js"></script>
  <script type="text/javascript" src="Scripts/Common/timeoutEvent.js"></script>
  <script type="text/javascript" src="Scripts/Common/drImage.js"></script>
  <script type="text/javascript" src="Scripts/Common/clip.js"></script>
  <script type="text/javascript" src="Scripts/Common/animation.js"></script>
  <script type="text/javascript" src="Scripts/Common/multipleImage.js"></script>
  <script type="text/javascript" src="Scripts/Common/font.js"></script>
  <script type="text/javascript" src="Scripts/Common/markEffect.js"></script>
  <script type="text/javascript" src="Scripts/Common/limitLoop.js"></script>
  <script type="text/javascript" src="Scripts/Common/particle.js"></script>
  <script type="text/javascript" src="Scripts/Common/renderingZone.js"></script>
  <script type="text/javascript" src="Scripts/Common/screenChange.js"></script>
  <script type="text/javascript" src="Scripts/paddle.js"></script>
  <script type="text/javascript" src="Scripts/brick.js"></script>
  <script type="text/javascript" src="Scripts/ball.js"></script>
  <script type="text/javascript" src="Scripts/bonus.js"></script>
  <script type="text/javascript" src="Scripts/bonusEvents.js"></script>
  <script type="text/javascript" src="Scripts/explosion.js"></script>
  <script type="text/javascript" src="Scripts/highScore.js"></script>
  <script type="text/javascript" src="Scripts/levelData.js"></script>
  <script type="text/javascript" src="Scripts/level.js"></script>
  <script type="text/javascript" src="Scripts/player.js"></script>
  <script type="text/javascript" src="Scripts/mainMenu.js"></script>
  <script type="text/javascript" src="Scripts/inGame.js"></script>
  <script type="text/javascript" src="Scripts/main.js"></script>

</body>

</html>
